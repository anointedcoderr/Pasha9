# Built by Anointed Coder.
# Nginx site config for pasha9.com and www.pasha9.com.
# Copy to /etc/nginx/sites-available/pasha9 then symlink into sites-enabled.
# Certbot will rewrite the listen 443 blocks once SSL is issued; the redirect
# blocks below catch the bare HTTP request before that.

upstream pasha9_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP to HTTPS redirect, also serves the Let's Encrypt challenge.
server {
    listen 80;
    listen [::]:80;
    server_name pasha9.com www.pasha9.com;

    # Reserved for Certbot http-01 challenge files.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Apex HTTPS host (Certbot adds the ssl_certificate lines automatically).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pasha9.com;

    # Pasha9 brand: keep these uploads behind Nginx with caching.
    # Uploads are written by PM2 to /var/www/pasha9/uploads via the upload API.
    location /uploads/ {
        alias /var/www/pasha9/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff";

        # Block dotfiles and anything execution-shaped.
        location ~* /\. { deny all; }
        location ~* \.(php|cgi|sh|asp|aspx|exe)$ { deny all; }
    }

    # Standard security headers. CSP can be tightened once tracking pixels are configured.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 90M;

    # Forward everything else to the Next.js PM2 process.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://pasha9_web;
    }
}

# www subdomain redirects to the apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pasha9.com;
    return 301 https://pasha9.com$request_uri;
}
