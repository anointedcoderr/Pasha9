# Built by Anointed Coder.
# Nginx site config for pasha9.com and www.pasha9.com.
# Copy to /etc/nginx/sites-available/pasha9 then symlink into sites-enabled.
# This file is valid standalone: both 443 blocks carry the standard certbot
# ssl_certificate lines pointing at the live Let's Encrypt paths. Before
# copying it over a live box, confirm the cert path matches what certbot
# actually issued there (see the runbook, docs/CLOUDFLARE-SETUP.md Phase 5a).

upstream pasha9_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Cloudflare real client IP restore.
#
# When Cloudflare proxies the site (orange cloud), every TCP connection we
# see comes from a Cloudflare edge IP. These directives tell Nginx to trust
# the CF-Connecting-IP header, but ONLY when the connection really comes
# from one of the published Cloudflare ranges below. After that, $remote_addr
# holds the real player IP again, so X-Real-IP and X-Forwarded-For passed to
# the app stay correct and IP based features (rate limits, IP blocks,
# activity logs) keep seeing real addresses.
#
# Safe without Cloudflare too: if the connection is not from a Cloudflare
# range, the header is ignored and nothing changes.
#
# Ranges pulled from https://www.cloudflare.com/ips-v4 and /ips-v6 on
# 2026-07-02. Re-check that page once or twice a year; changes are rare.
# ---------------------------------------------------------------------------

# Cloudflare IPv4 ranges
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 ranges
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# HTTP to HTTPS redirect, also serves the Let's Encrypt challenge.
server {
    listen 80;
    listen [::]:80;
    server_name pasha9.com www.pasha9.com;

    # Reserved for Certbot http-01 challenge files.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Apex HTTPS host.
# Later, once Cloudflare fronts the site, the Let's Encrypt cert here can be
# swapped for a Cloudflare Origin CA cert (15 year validity, trusted only by
# Cloudflare): replace the certbot managed ssl_certificate and
# ssl_certificate_key lines with the Origin CA pair, keep SSL mode
# "Full (strict)" in the Cloudflare dashboard. Do not change cert paths in
# this file for the initial cutover; the existing Let's Encrypt cert already
# satisfies Full (strict).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pasha9.com;

    # Certbot manages the actual certificate files at these paths; this file
    # only points at them. If the live box issued under a different lineage
    # (for example pasha9.com-0001), fix the paths before deploying.
    ssl_certificate /etc/letsencrypt/live/pasha9.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pasha9.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Let's Encrypt HTTP-01 challenge, needed on 443 as well: with
    # "Always Use HTTPS" at the Cloudflare edge, challenge requests are
    # redirected to https before they reach the origin, so the 443 host
    # must serve the webroot too or renewals fail.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Pasha9 brand: keep these uploads behind Nginx with caching.
    # Uploads are written by PM2 to /var/www/pasha9/uploads via the upload API.
    location /uploads/ {
        alias /var/www/pasha9/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff";

        # Block dotfiles and anything execution-shaped.
        location ~* /\. { deny all; }
        location ~* \.(php|cgi|sh|asp|aspx|exe)$ { deny all; }
    }

    # Standard security headers. CSP can be tightened once tracking pixels are configured.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Upload cap. Banner video uploads need at least 25m; 90M keeps ample
    # headroom for admin media uploads and stays under the Cloudflare free
    # plan request body limit of 100 MB.
    client_max_body_size 90M;

    # Forward everything else to the Next.js PM2 process.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://pasha9_web;
    }
}

# www subdomain redirects to the apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pasha9.com;

    # Certbot manages the actual certificate files at these paths; this file
    # only points at them. Same lineage caution as the apex block above.
    ssl_certificate /etc/letsencrypt/live/pasha9.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pasha9.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Serve the HTTP-01 challenge here too (Always Use HTTPS lands
    # www challenges on this block); the redirect must not swallow it.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://pasha9.com$request_uri;
    }
}
